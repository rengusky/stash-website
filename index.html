<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stash — Saved, not forgotten</title>
  <meta name="description" content="Stash is a calm home for the links and images you save — it files them, then reminds you to come back. Join the waitlist.">
  <meta property="og:title" content="Stash — Saved, not forgotten">
  <meta property="og:description" content="A calm home for everything you save. Files itself, reminds you later. Join the waitlist.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/+esm"
      }
    }
  </script>
</head>
<body>

  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <div class="page">
    <header class="topbar">
      <p class="wordmark">STASH</p>
      <p class="coming">Coming soon — iPhone · iPad · Mac</p>
    </header>

    <main class="stage">
      <h1 class="headline">
        <span class="line"><span class="line-inner">SAVED,</span></span>
        <span class="line"><span class="line-inner">NOT&nbsp;FORGOTTEN.</span></span>
      </h1>

      <p class="sub">
        Stash is a calm home for the links and images you save —
        it files them, then reminds you to come back.
      </p>

      <form class="waitlist" data-waitlist action="#" method="POST">
        <label class="visually-hidden" for="email">Email address</label>
        <input id="email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        <button type="submit" data-magnetic><span>Get early access</span></button>
        <p class="form-note" role="status" aria-live="polite"></p>
      </form>
    </main>

    <footer class="baseline">
      <p>© 2026 Stash</p>
      <p>Built for people with 400 open tabs</p>
    </footer>
  </div>

  <div class="cursor" aria-hidden="true"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
